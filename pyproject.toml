[project]
name = "hunches"
version = "0.1.0"
description = "Interactive TUI toolkit for content analysis over an already-embedded corpus."
readme = "README.md"
authors = [{ name = "Chris Hacker", email = "c.m.hacker1997@gmail.com" }]
requires-python = ">=3.12"
# pydantic-ai-slim with the providers we use. boto3 and psycopg serve the S3 Vectors and pgvector
# backends (RDS/Aurora IAM needs both). Local Sentence Transformers embeddings stay an extra
# ("local", pydantic-ai-slim gates it to Python < 3.14) because PyTorch with its CUDA wheels adds
# about 5.5 GB on Linux. The full `pydantic-ai` metapackage would install every provider.
dependencies = [
    "pydantic-ai-slim[anthropic,openai]",
    "textual[syntax]",
    "numpy",
    "genai-prices",
    "pyyaml",
    "python-dotenv",
    "platformdirs>=4.12.2",
    "keyring>=25.7.0",
    "boto3",
    "psycopg[binary]",
]

[project.optional-dependencies]
local = ["pydantic-ai-slim[sentence-transformers]"]

[project.scripts]
hunches = "hunches.app:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-textual-snapshot",
    "ruff",
    "ty",
    "pre-commit",
    "types-pyyaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-n auto"
markers = [
    "ui: drives a Textual app with Pilot (slow); pre-commit skips these, CI runs them",
    "descriptions: keeps the missing-descriptions popup on (it is switched off for every other test)",
]
testpaths = ["tests"]
