[project]
name = "hunches"
version = "0.1.0"
description = "Content analysis over a corpus (semantic search, keywords or the whole corpus, then an LLM classifier checked against human labels), as a Python library."
readme = "README.md"
authors = [{ name = "Chris Hacker", email = "c.m.hacker1997@gmail.com" }]
requires-python = ">=3.12"
# pydantic-ai: the slim package with provider extras (pydantic-ai-slim[anthropic,openai]) avoids
# pulling every provider. Local Sentence Transformers embeddings come from the pydantic-ai-slim
# extra "sentence-transformers" (needs Python < 3.14), exposed here as our optional extra "local".
# The full `pydantic-ai` metapackage would also work but installs all providers.
dependencies = [
    "pydantic-ai-slim[anthropic,openai]",
    "numpy",
    "genai-prices",
    "pyyaml",
]

[project.optional-dependencies]
s3 = ["boto3"]
pg = ["psycopg[binary]"]
rds = ["psycopg[binary]", "boto3"]
local = ["pydantic-ai-slim[sentence-transformers]"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "ruff",
    "ty",
    "pre-commit",
    "types-pyyaml",
    "polars",
    "pandas",
    "nbclient>=0.11.0",
    "ipykernel>=7.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-n auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["B018"]  # a notebook cell ends with the value it displays
"e2e/**" = ["B018"]

[tool.ty.src]
# specs: design handoff files import textual, which is no longer a dependency.
exclude = ["specs"]
