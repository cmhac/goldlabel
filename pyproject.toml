[project]
name = "goldlabel"
version = "0.5.0"
description = "Content analysis over a corpus (semantic search, keywords or the whole corpus, then an LLM classifier checked against human labels), as a Python library."
readme = "README.md"
authors = [{ name = "Chris Hacker", email = "c.m.hacker1997@gmail.com" }]
requires-python = ">=3.11"
# pydantic-ai: the slim package with provider extras (pydantic-ai-slim[anthropic,openai]) avoids
# pulling every provider. Local Sentence Transformers embeddings come from the pydantic-ai-slim
# extra "sentence-transformers" (needs Python < 3.14), exposed here as our optional extra "local".
# The full `pydantic-ai` metapackage would also work but installs all providers.
dependencies = [
    "pydantic-ai-slim[anthropic,openai]",
    "numpy",
    "genai-prices",
    "pyyaml",
    "polars",
    "pyarrow",
]

[project.scripts]
goldlabel = "goldlabel.cli:main"

[project.optional-dependencies]
s3 = ["boto3"]
pg = ["psycopg[binary]"]
rds = ["psycopg[binary]", "boto3"]
local = ["pydantic-ai-slim[sentence-transformers]"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "ruff",
    "ty",
    "pre-commit",
    "types-pyyaml",
    "pandas",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-n auto"
testpaths = ["tests"]

[tool.ruff.lint]
# Public docstrings are for a person with no agent: D (Google style), plus Returns and Raises,
# which are preview rules in this ruff; explicit-preview-rules turns on only the codes named here.
extend-select = ["D", "DOC201", "DOC501"]
preview = true
explicit-preview-rules = true
ignore = [
    "D105", "D107",  # dunder methods; constructor arguments live in the class docstring
    # preview mode also switches on ruff's preview default rules; these three flagged 20 old lines
    # (16 test regexes, 3 noqa comments, 1 ternary) that this change does not touch
    "RUF043", "RUF100", "FURB110",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["B018", "D", "DOC"]  # a notebook cell ends with the value it displays
"tests/**" = ["D", "DOC"]
"scripts/**" = ["D", "DOC"]
"specs/**" = ["D", "DOC"]
# private modules: their names start with an underscore (`_label.py` holds the exported `label`, so it is checked)
"src/goldlabel/_html.py" = ["D", "DOC"]
"src/goldlabel/_frame.py" = ["D", "DOC"]
"src/goldlabel/_sync.py" = ["D", "DOC"]
"src/goldlabel/_gold_rule.py" = ["D", "DOC"]

[tool.ty.src]
# specs: design handoff files import textual, which is no longer a dependency.
exclude = ["specs"]
